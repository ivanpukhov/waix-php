name: SDK checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Composer metadata and real cURL tests
        run: |
          docker run --rm --mount type=bind,src="$PWD",dst=/app -w /app composer:2@sha256:a5f59b9fd2faf31218632be4809dc6491761085e8064c31dc3b84378c48c248b validate --strict
          docker run --rm --mount type=bind,src="$PWD",dst=/app -w /app composer:2@sha256:a5f59b9fd2faf31218632be4809dc6491761085e8064c31dc3b84378c48c248b sh -c 'php -S 127.0.0.1:3342 tests/router.php >/tmp/server.log 2>&1 & test_server_pid=$!; trap "kill $test_server_pid" EXIT; sleep 1; WAIX_TEST_URL=http://127.0.0.1:3342/api/v1 php tests/client.php'
